packages:
  - "examples/nextjs-app"
  - "packages/connectkit"
  - "packages/pay-common"

allowBuilds:
  "@reown/appkit": true
  bigint-buffer: true
  blake-hash: true
  bufferutil: true
  core-js: true
  esbuild: true
  keccak: true
  msw: true
  protobufjs: true
  secp256k1: true
  sharp: true
  tiny-secp256k1: true
  unrs-resolver: true
  usb: true
  utf-8-validate: true

overrides:
  playwright-core: "1.61.1"
  "@stellar/stellar-sdk": "^14.4.3"
  rollup: "^4.24.0"
  bs58: "^6.0.0"
  "@solana/sysvars": "^3.0.3"
  utf-8-validate: "6.0.6"
  react: "18.2.0"
  react-dom: "18.2.0"
  viem: "^2.23.2"
  wagmi: "^2.14.11"
  "@walletconnect/core": "2.23.10"
  "@walletconnect/sign-client": "2.23.10"
  "@walletconnect/universal-provider": "2.23.10"
  "@walletconnect/ethereum-provider": "2.23.10"
  # Force single @reown/appkit version to avoid custom element collision
  "@reown/appkit": "1.8.23"
  "@reown/appkit-common": "1.8.23"
  "@reown/appkit-controllers": "1.8.23"
  "@reown/appkit-pay": "1.8.23"
  "@reown/appkit-polyfills": "1.8.23"
  "@reown/appkit-scaffold-ui": "1.8.23"
  "@reown/appkit-ui": "1.8.23"
  "@reown/appkit-utils": "1.8.23"
  "@reown/appkit-wallet": "1.8.23"

dedupePeerDependents: true

minimumReleaseAge: 0

peerDependencyRules:
  allowedVersions:
    "@stellar/stellar-sdk": "14"
    rollup: "4"
    react: "18"
    "@types/react": "18"
  ignoreMissing:
    - react-native
