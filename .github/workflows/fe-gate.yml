name: fe-gate
# fe-gate is the every-PR frontend gate, so pull_request has no path filter.
# Only the post-merge run on the default branch skips docs-only changes.
on:
  pull_request:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
concurrency:
  group: fe-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    uses: RozoAI/fe-gate/.github/workflows/gate.yml@c83faa090649a31b6ff3d868b39b9f74a4c96ce8
    with:
      package-manager: pnpm
      node-version: "22"
      unit-command: pnpm --filter "examples/nextjs-app" run test:gate && pnpm --filter @rozoai/intent-pay test
      e2e-command: pnpm --filter "examples/nextjs-app" run test:pages
